<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de games.json - JuanZEROGames</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #1a1c1e; color: #e0e0e0; padding: 20px; }
    h1 { margin-bottom: 20px; color: #bb86fc; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 4px; color: #bb86fc; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 8px; background: #2c2f33; color: white; }
    button { background: #bb86fc; color: #1a1c1e; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-right: 8px; }
    .game-list { list-style: none; }
    .game-item { background: #2c2f33; padding: 15px; margin-bottom: 10px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
    .btn-group button { margin-left: 10px; padding: 6px 12px; border-radius: 16px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    #loadFile { display: none; }
  </style>
</head>
<body>
  <h1>⚙️ Generador de games.json</h1>
  
  <div class="toolbar">
    <button onclick="document.getElementById('loadFile').click()">📂 Cargar JSON</button>
    <input type="file" id="loadFile" accept=".json" onchange="loadJSON(event)">
    <button onclick="clearAll()">🗑️ Limpiar todo</button>
    <button onclick="exportJSON()">📥 Descargar games.json</button>
  </div>

  <div class="form-grid">
    <div><label>Título</label><input type="text" id="title" placeholder="Nombre del juego"></div>
    <div><label>Género</label><input type="text" id="genre" placeholder="Ej: Acción, RPG, Carreras..."></div>
    <div><label>Descripción</label><textarea id="desc" rows="2"></textarea></div>
    <div><label>Desarrollador</label><input type="text" id="dev" placeholder="Estudio"></div>
    <div><label>Icono URL</label><input type="url" id="icon" placeholder="https://..."></div>
    <div><label>APK Link</label><input type="url" id="apk" placeholder="Enlace directo"></div>
    <div><label>Screenshots (separadas por coma)</label><input type="text" id="screenshots" placeholder="url1,url2"></div>
  </div>
  <button onclick="addGame()" style="margin-bottom:20px;">➕ Añadir juego</button>

  <h2 style="margin:20px 0 10px; color:#bb86fc;">Lista actual (<span id="gameCount">0</span> juegos)</h2>
  <ul class="game-list" id="gameList"></ul>

  <script>
    let games = [];
    let editId = null;

    function updateCount() {
      document.getElementById('gameCount').textContent = games.length;
    }

    function render() {
      const list = document.getElementById('gameList');
      list.innerHTML = games.map(g => `
        <li class="game-item">
          <span><strong>${g.title}</strong> (${g.genre})</span>
          <div class="btn-group">
            <button onclick="editGame(${g.id})">✏️ Editar</button>
            <button onclick="deleteGame(${g.id})">🗑️</button>
          </div>
        </li>
      `).join('');
      updateCount();
    }

    function addGame() {
      const title = document.getElementById('title').value.trim();
      const genre = document.getElementById('genre').value.trim();
      const description = document.getElementById('desc').value.trim();
      const developer = document.getElementById('dev').value.trim();
      const iconUrl = document.getElementById('icon').value.trim();
      const apkLink = document.getElementById('apk').value.trim();
      const screenshots = document.getElementById('screenshots').value.split(',').map(s=>s.trim()).filter(s=>s);
      
      if (!title || !apkLink) return alert('Título y APK obligatorios');
      
      const game = {
        id: editId || Date.now(),
        title,
        genre: genre || 'Sin género',
        description,
        developer,
        iconUrl,
        screenshots,
        apkLink
      };
      
      if (editId) {
        const idx = games.findIndex(g=>g.id===editId);
        if (idx>-1) games[idx] = game;
        editId = null;
      } else {
        games.push(game);
      }
      clearForm();
      render();
    }

    function editGame(id) {
      const g = games.find(g=>g.id===id);
      if (!g) return;
      document.getElementById('title').value = g.title;
      document.getElementById('genre').value = g.genre;
      document.getElementById('desc').value = g.description;
      document.getElementById('dev').value = g.developer;
      document.getElementById('icon').value = g.iconUrl;
      document.getElementById('apk').value = g.apkLink;
      document.getElementById('screenshots').value = (g.screenshots||[]).join(',');
      editId = id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteGame(id) {
      games = games.filter(g=>g.id!==id);
      render();
    }

    function clearForm() {
      ['title','genre','desc','dev','icon','apk','screenshots'].forEach(id=> document.getElementById(id).value='');
      editId = null;
    }

    function clearAll() {
      if (confirm('¿Seguro que quieres eliminar toda la lista?')) {
        games = [];
        render();
        clearForm();
      }
    }

    function exportJSON() {
      const dataStr = JSON.stringify(games, null, 2);
      const blob = new Blob([dataStr], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'games.json';
      a.click();
    }

    function loadJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data)) throw new Error('El JSON no es un array');
          for (let item of data) {
            if (!item.title || !item.apkLink) throw new Error('Elementos sin título o apkLink');
          }
          games = data;
          render();
          alert(`Se cargaron ${games.length} juegos.`);
        } catch (err) {
          alert('Error al leer el JSON: ' + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Inicial
    render();
  </script>
</body>
</html>
